<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HuzTIers — Minecraft PvP Tier List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      background-color: #060911;
      color: #f8fafc;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    @keyframes logoShimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    @keyframes rowSlideUp {
      0% { opacity: 0; transform: translateY(12px) scale(0.99); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes skinLiveWalk {
      0%, 100% { transform: translateY(0px) rotate(-3deg) scale(1); }
      25% { transform: translateY(-4px) rotate(1.5deg) scale(1.03); }
      50% { transform: translateY(0px) rotate(3deg) scale(1); }
      75% { transform: translateY(-4px) rotate(-1.5deg) scale(1.03); }
    }
    @keyframes skinHeadBob {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-3px) rotate(4deg); }
    }
    @keyframes skinEmoteJump {
      0% { transform: translateY(0) scale(1) rotate(0deg); }
      30% { transform: translateY(-10px) scale(1.12) rotate(-6deg); }
      65% { transform: translateY(-4px) scale(1.08) rotate(6deg); }
      100% { transform: translateY(0) scale(1.05) rotate(0deg); }
    }
    @keyframes armSwingLeft {
      0%, 100% { transform: rotate(-16deg); }
      50% { transform: rotate(18deg); }
    }
    @keyframes armSwingRight {
      0%, 100% { transform: rotate(18deg); }
      50% { transform: rotate(-16deg); }
    }
    @keyframes legWalkLeft {
      0%, 100% { transform: rotate(14deg); }
      50% { transform: rotate(-14deg); }
    }
    @keyframes legWalkRight {
      0%, 100% { transform: rotate(-14deg); }
      50% { transform: rotate(14deg); }
    }
    @keyframes headNod {
      0%, 100% { transform: rotate(-4deg) translateY(0px); }
      50% { transform: rotate(4deg) translateY(-1.5px); }
    }
    @keyframes floatChampion {
      0%, 100% { transform: translateY(0px) rotate(-1deg); }
      50% { transform: translateY(-7px) rotate(1deg); }
    }
    @keyframes auraPulse {
      0%, 100% { opacity: 0.55; transform: scale(0.96); }
      50% { opacity: 0.95; transform: scale(1.06); }
    }
    @keyframes modalPop {
      0% { opacity: 0; transform: scale(0.94) translateY(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes badgeFloatBob {
      0%, 100% { transform: translateY(0px) rotate(-1.5deg); }
      50% { transform: translateY(-4px) rotate(1.5deg); }
    }
    @keyframes adminScanLine {
      0% { transform: translateY(-100%); opacity: 0; }
      25% { opacity: 0.45; }
      75% { opacity: 0.45; }
      100% { transform: translateY(380%); opacity: 0; }
    }
    @keyframes adminRadarPulse {
      0% { transform: scale(0.85); opacity: 0.85; }
      100% { transform: scale(2.1); opacity: 0; }
    }
    @keyframes adminCardFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes orbitSpinSlow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes holoSweep {
      0% { background-position: -150% 0; }
      100% { background-position: 250% 0; }
    }

    .skin-live-walk {
      animation: skinLiveWalk 1.85s ease-in-out infinite;
      will-change: transform;
    }
    .skin-head-bob {
      animation: skinHeadBob 2.2s ease-in-out infinite;
      will-change: transform;
    }
    .skin-active-emote {
      animation: skinEmoteJump 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards !important;
    }
    .skin-arm-left { animation: armSwingLeft 1.2s ease-in-out infinite; }
    .skin-arm-right { animation: armSwingRight 1.2s ease-in-out infinite; }
    .skin-leg-left { animation: legWalkLeft 1.2s ease-in-out infinite; }
    .skin-leg-right { animation: legWalkRight 1.2s ease-in-out infinite; }
    .skin-head-nod { animation: headNod 2s ease-in-out infinite; }

    .logo-shimmer-text {
      background: linear-gradient(90deg, #fef08a 0%, #f59e0b 25%, #ffffff 50%, #f59e0b 75%, #fef08a 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: logoShimmer 4.2s linear infinite;
    }
    .animate-row-enter {
      animation: rowSlideUp 0.34s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .animate-champion-float {
      animation: floatChampion 3.6s ease-in-out infinite;
    }
    .animate-aura-pulse {
      animation: auraPulse 3.2s ease-in-out infinite;
    }
    .animate-modal-pop {
      animation: modalPop 0.24s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .badge-float-bob {
      animation: badgeFloatBob 3.2s ease-in-out infinite;
    }
    .admin-panel-shell {
      position: relative;
      overflow: hidden;
      animation: adminCardFloat 4.8s ease-in-out infinite;
    }
    .admin-panel-shell::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 36%;
      background: linear-gradient(180deg, transparent, rgba(251, 191, 36, 0.06), transparent);
      animation: adminScanLine 5.5s linear infinite;
      pointer-events: none;
      z-index: 1;
    }
    .admin-radar-ring {
      animation: adminRadarPulse 2.4s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }
    .animate-orbit-slow {
      animation: orbitSpinSlow 18s linear infinite;
    }
    .animate-holo-sweep {
      background: linear-gradient(110deg, transparent 25%, rgba(251, 191, 36, 0.14) 45%, rgba(56, 189, 248, 0.14) 55%, transparent 75%);
      background-size: 200% 100%;
      animation: holoSweep 4.8s ease-in-out infinite;
    }
    .card-lift {
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.22s ease, box-shadow 0.22s ease, background-color 0.22s ease;
    }
    .card-lift:hover {
      transform: translateY(-2px);
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #070a12; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
  </style>

    function hashSeed(seed) {
      let h = 2166136261;
      const str = String(seed || 'Player');
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return Math.abs(h);
    }

    function getFallbackSkinSvg(seed, size = 48, isBody = false) {
      const h = hashSeed(seed);
      const delay = ((h % 24) * 0.13).toFixed(2);

      const secondaryColor = `hsl(${(h * 7) % 360}, 68%, 42%)`;
      const eyeColor = `hsl(${((h % 360) + 140) % 360}, 85%, 62%)`;
      const skinTone = ['#f4c7a1', '#e0ac69', '#c68642', '#8d5524', '#ffdbac'][h % 5];

    function renderSkinHtml(seed, size = 44, isBody = false, extraClass = '') {
      const safe = escapeHtml(String(seed || 'Player'));
      const encoded = encodeURIComponent(String(seed || 'Player'));
      const delay = ((hashSeed(seed) % 24) * 0.13).toFixed(2);
      const url = isBody
        ? `https://mc-heads.net/body/${encoded}/${Math.max(80, size * 2)}/right`
        : `https://mc-heads.net/avatar/${encoded}/${Math.max(32, size * 2)}`;
      const fallback = getFallbackSkinSvg(seed, size, isBody).replace(/"/g, '&quot;');
      const animClass = isBody ? 'skin-live-walk' : 'skin-head-bob';

      return `
        <div style="animation-delay: ${delay}s" onmouseenter="this.classList.add('skin-active-emote')" onmouseleave="this.classList.remove('skin-active-emote')" class="inline-flex items-center justify-center shrink-0 select-none ${animClass} ${extraClass}">
          <img src="${url}" alt="${safe} Minecraft skin" width="${size}" height="${size}" loading="lazy"
            style="width:${size}px;height:${isBody ? 'auto' : size + 'px'};max-height:${isBody ? Math.round(size * 1.3) : size}px;"
            class="object-contain drop-shadow-[0_6px_10px_rgba(0,0,0,0.65)] pointer-events-none"
            onerror="this.outerHTML = decodeURIComponent('${encodeURIComponent(getFallbackSkinSvg(seed, size, isBody))}')" />
        </div>
      `;
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function safeLocalStorageGet(key) {
      try {
        return localStorage.getItem(key);
      } catch {
        return null;
      }
    }

    function safeLocalStorageSet(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch {
        // Ignore storage errors (e.g. sandboxed iframe)
      }
    }

    function safeLocalStorageRemove(key) {
      try {
        localStorage.removeItem(key);
      } catch {
        // Ignore storage errors
      }
    }

    function loadJson(key, fallback) {
      try {
        const raw = safeLocalStorageGet(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch {
        return fallback;
      }
    }

    function saveJson(key, value) {
      try {
        safeLocalStorageSet(key, JSON.stringify(value));
      } catch {

    }

    function computePoints(player) {
      let total = 0;
      for (const m of ALL_MODES) {
        const code = player?.tiers?.[m.id] || '???';
        total += Number(state.tierPoints[code] ?? 0);
      }
      return total;
    }

    function getTitleFromPoints(pts) {
      if (pts >= 340) return 'Combat Grandmaster';
      if (pts >= 250) return 'Combat Master';
      if (pts >= 170) return 'Combat Ace';
      if (pts >= 90) return 'Combat Striker';
      return 'Combat Challenger';
    }

    function getRegionBadge(region) {
      const r = String(region || '').toLowerCase();
      if (r.includes('north') || r === 'na') return { code: 'NA', cls: 'bg-rose-500/15 text-rose-300 border-rose-500/35' };
      if (r.includes('europe') || r === 'eu') return { code: 'EU', cls: 'bg-emerald-500/15 text-emerald-300 border-emerald-500/35' };
      if (r.includes('asia') || r === 'as') return { code: 'AS', cls: 'bg-sky-500/15 text-sky-300 border-sky-500/35' };
      return { code: 'SA', cls: 'bg-amber-500/15 text-amber-300 border-amber-500/35' };
    }

    function getRankRibbonCss(rank) {
      if (rank === 1) return 'background:linear-gradient(135deg,#facc15 0%,#eab308 55%,#b45309 100%);color:#fff;text-shadow:0 2px 6px rgba(0,0,0,0.45);clip-path:polygon(0 0,100% 0,84% 100%,0% 100%);';
      if (rank === 2) return 'background:linear-gradient(135deg,#e2e8f0 0%,#94a3b8 60%,#475569 100%);color:#fff;text-shadow:0 2px 6px rgba(0,0,0,0.45);clip-path:polygon(0 0,100% 0,84% 100%,0% 100%);';
      if (rank === 3) return 'background:linear-gradient(135deg,#fdba74 0%,#ea580c 60%,#7c2d12 100%);color:#fff;text-shadow:0 2px 6px rgba(0,0,0,0.45);clip-path:polygon(0 0,100% 0,84% 100%,0% 100%);';
      return 'background:linear-gradient(135deg,#1b2436 0%,#111827 100%);color:#cbd5e1;clip-path:polygon(0 0,100% 0,84% 100%,0% 100%);';
    }

    function getRankedOverall() {
      const list = state.players.map((p) => {
        const points = computePoints(p);
        const bonus = state.homeBoardMode === 'LEGACY' ? (p.wins || 0) % 25 : 0;
        return { ...p, points, effectivePoints: points + bonus, title: getTitleFromPoints(points) };
      });
      list.sort((a, b) => b.effectivePoints - a.effectivePoints || (b.wins || 0) - (a.wins || 0));
      return list.map((p, idx) => ({ ...p, rank: idx + 1 }));
    }

    function getRankedForMode(modeId) {
      const list = state.players.map((p) => {
        const modeTier = p.tiers?.[modeId] || '???';
        const modePoints = Number(state.tierPoints[modeTier] ?? 0);
        const score = Number((modePoints * 68 + (p.wins || 100) * 5.2).toFixed(1));
        return { ...p, modeTier, modePoints, score, points: computePoints(p), title: getTitleFromPoints(computePoints(p)) };
      });
      list.sort((a, b) => {
        const sa = TIER_LEVELS.indexOf(a.modeTier);
        const sb = TIER_LEVELS.indexOf(b.modeTier);
        const ra = sa === -1 ? 999 : sa;
        const rb = sb === -1 ? 999 : sb;
        if (ra !== rb) return ra - rb;
        return b.score - a.score;
      });
      return list.map((p, idx) => ({ ...p, modeRank: idx + 1 }));
    }

    function generateLinkCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = 'HUZ-';
      for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
      return code;
    }

    async function sendWebhookAlert(content) {
      try {
        const res = await fetch(DISCORD_LINK_WEBHOOK, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: 'HuzTIers Bot', content }),
        });
        return Boolean(res && res.ok);
      } catch {
        return false;
      }
    }

    function assignTier(playerId, modeId, tierCode) {
      const target = state.players.find((p) => p.id === playerId);
      const modeLabel = ALL_MODES.find((m) => m.id === modeId)?.label || modeId.toUpperCase();
      state.players = state.players.map((p) =>
        p.id === playerId ? { ...p, tiers: { ...(p.tiers || {}), [modeId]: tierCode } } : p
      );
      saveJson(STORAGE_KEYS.players, state.players);

      if (target && tierCode !== '???') {
        state.botAlerts = [
          {
            id: `bot-${Date.now()}`,
            ign: target.ign,
            mode: modeLabel,
            tier: tierCode,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          },
          ...state.botAlerts.slice(0, 6),
        ];
        sendWebhookAlert(`🏅 **Tier Assigned!** **${target.ign}** received **${tierCode}** in **${modeLabel}** on \`${SERVER_IP}\`.`);
      }
      showToast(`Updated ${target?.ign || 'Player'} · ${modeLabel} → ${tierCode}`);
      render();
    }

                <div class="min-w-0">
                  <div class="text-base font-black text-white truncate">${escapeHtml(u.ign)}</div>
                  <div class="text-xs text-slate-400 truncate">Discord: ${escapeHtml(u.discord)} · ${escapeHtml(u.region)}</div>
                  <div class="text-[11px] font-mono text-amber-300 mt-1">Code: ${escapeHtml(u.linkCode || 'HUZ-LINK')}</div>
                </div>
              </div>
              <p class="text-xs text-slate-400">Your account is locked & remembered on this browser until unlinked. Join <strong class="text-slate-200">${SERVER_IP}</strong> or Discord for tier testing.</p>
              <div class="flex items-center justify-between pt-2">
                <button id="unlink-account-btn" type="button" class="px-4 py-2 rounded-xl bg-rose-950/70 hover:bg-rose-900 border border-rose-800/60 text-xs font-bold text-rose-200">Unlink Account</button>
                <button id="done-modal-btn" type="button" class="px-4 py-2 rounded-xl bg-amber-400 hover:bg-amber-300 text-xs font-black text-slate-950">Done</button>
              </div>
            </div>
          </div>
        `;
      } else if (state.modal === 'login') {
        root.innerHTML = `
          <div id="modal-backdrop" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
            <form id="login-account-form" onclick="event.stopPropagation()" class="animate-modal-pop w-full max-w-md rounded-3xl bg-[#0b101d] border border-slate-800 p-6 space-y-4 shadow-2xl">
              <div class="flex items-center justify-between">
                <div>
                  <h3 class="text-lg font-black text-white">Login to HuzTIers</h3>
                  <p class="text-[11px] text-slate-400">Sign in with your registered Minecraft IGN and password.</p>
                </div>
                <button id="close-modal-btn" type="button" class="text-slate-400 hover:text-white">✕</button>
              </div>
              <div id="login-error-box" class="hidden rounded-xl bg-rose-950/60 border border-rose-700/70 p-3 text-xs font-semibold text-rose-200"></div>
              <div>
                <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Minecraft IGN *</label>
                <input id="login-ign-input" type="text" required placeholder="Enter your registered IGN..." class="w-full px-3.5 py-2 rounded-xl bg-[#070b14] border border-slate-800 text-sm text-white" />
              </div>
              <div>
                <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Password *</label>
                <input id="login-pass-input" type="password" required placeholder="Enter your account password..." class="w-full px-3.5 py-2 rounded-xl bg-[#070b14] border border-slate-800 text-sm text-white" />
              </div>
              <div class="flex items-center justify-between pt-2">
                <button id="switch-to-register-btn" type="button" class="text-xs font-bold text-amber-300 hover:text-amber-200">Need an account? Register</button>
                <button type="submit" class="px-4 py-2 rounded-xl bg-amber-400 hover:bg-amber-300 text-xs font-extrabold text-slate-950">Login</button>
              </div>
            </form>
          </div>
        `;
      } else if (state.modal === 'register') {
        root.innerHTML = `
          <div id="modal-backdrop" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
            <form id="register-account-form" onclick="event.stopPropagation()" class="animate-modal-pop w-full max-w-md rounded-3xl bg-[#0b101d] border border-slate-800 p-6 space-y-4 shadow-2xl">
              <div class="flex items-center justify-between">
                <div>
                  <h3 class="text-lg font-black text-white">Register & Link Discord</h3>
                  <p class="text-[11px] text-slate-400">Starts Unranked (???) until tested & assigned by staff.</p>
                </div>
                <button id="close-modal-btn" type="button" class="text-slate-400 hover:text-white">✕</button>
              </div>
              <div>
                <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Minecraft IGN *</label>
                <input id="reg-ign-input" type="text" required placeholder="Enter your Minecraft username..." class="w-full px-3.5 py-2 rounded-xl bg-[#070b14] border border-slate-800 text-sm text-white" />
              </div>
              <div>
                <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Discord Username *</label>
                <input id="reg-discord-input" type="text" required placeholder="e.g. username#0001" class="w-full px-3.5 py-2 rounded-xl bg-[#070b14] border border-slate-800 text-sm text-white" />
              </div>
              <div>
                <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Password *</label>
                <input id="reg-pass-input" type="password" required placeholder="Create a password..." class="w-full px-3.5 py-2 rounded-xl bg-[#070b14] border border-slate-800 text-sm text-white" />
              </div>
              <div>
                <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Region</label>
                <select id="reg-region-input" class="w-full px-3.5 py-2 rounded-xl bg-[#070b14] border border-slate-800 text-sm text-white">
                  <option value="North America">North America</option>
                  <option value="Europe">Europe</option>
                  <option value="Asia">Asia</option>
                  <option value="South America">South America</option>
                </select>
              </div>
              <div class="flex justify-end gap-2 pt-2">
                <button type="submit" class="px-4 py-2 rounded-xl bg-amber-400 hover:bg-amber-300 text-xs font-extrabold text-slate-950">Link & Send Code</button>
              </div>
            </form>
          </div>
        `;
      } else if (state.modal === 'distribution') {
        root.innerHTML = `
          <div id="modal-backdrop" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
            <div onclick="event.stopPropagation()" class="animate-modal-pop w-full max-w-md rounded-3xl bg-[#0b101d] border border-slate-800 p-6 space-y-4 shadow-2xl">
              <div class="flex items-center justify-between">
                <h3 class="text-lg font-black text-white">Tier Point Values</h3>
                <button id="close-modal-btn" type="button" class="text-slate-400 hover:text-white">✕</button>
              </div>
              <div class="grid grid-cols-2 gap-2 text-xs">
                ${TIER_LEVELS.map((t) => `<div class="rounded-xl bg-[#070b14] border border-slate-800 px-3 py-2 flex items-center justify-between"><span class="font-black text-amber-300">${t}</span><span class="font-mono text-slate-300">${state.tierPoints[t] ?? 0} pts</span></div>`).join('')}
              </div>
            </div>
          </div>
        `;
      } else if (state.modal === 'customAdd') {
        root.innerHTML = `
          <div id="modal-backdrop" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
            <form id="custom-add-form" onclick="event.stopPropagation()" class="animate-modal-pop w-full max-w-md rounded-3xl bg-[#0b101d] border border-slate-800 p-6 space-y-4 shadow-2xl">
              <div class="flex items-center justify-between">
                <h3 class="text-lg font-black text-white">Add Player</h3>
                <button id="close-modal-btn" type="button" class="text-slate-400 hover:text-white">✕</button>
              </div>
              <div>
                <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Minecraft IGN *</label>
                <input id="new-p-ign" type="text" required placeholder="IGN" class="w-full px-3.5 py-2 rounded-xl bg-[#070b14] border border-slate-800 text-sm text-white" />
              </div>
              <div>
                <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Region</label>
                <select id="new-p-region" class="w-full px-3.5 py-2 rounded-xl bg-[#070b14] border border-slate-800 text-sm text-white">
                  <option value="North America">North America</option>
                  <option value="Europe">Europe</option>
                  <option value="Asia">Asia</option>
                  <option value="South America">South America</option>
                </select>
              </div>
              <div class="flex justify-end gap-2 pt-2">
                <button type="submit" class="px-4 py-2 rounded-xl bg-emerald-400 hover:bg-emerald-300 text-xs font-black text-slate-950">Create Player</button>
              </div>
            </form>
          </div>
        `;
      }

      bindModalEvents();
    }

    function bindModalEvents() {
      const backdrop = document.getElementById('modal-backdrop');
      const closeBtn = document.getElementById('close-modal-btn');
      const doneBtn = document.getElementById('done-modal-btn');

      const closeModal = () => {
        state.modal = null;
        renderModals();
      };

      if (backdrop) backdrop.onclick = closeModal;
      if (closeBtn) closeBtn.onclick = closeModal;
      if (doneBtn) doneBtn.onclick = closeModal;

      const fullProfBtn = document.getElementById('modal-full-profile-btn');
      if (fullProfBtn) {
        fullProfBtn.onclick = () => {
          state.modal = null;
          state.page = 'rankings';
          state.activeMode = 'overall';
          render();
        };
      }

      const unlinkBtn = document.getElementById('unlink-account-btn');
      if (unlinkBtn) {
        unlinkBtn.onclick = () => {
          const oldIgn = state.linkedUser?.ign;
          state.linkedUser = null;
          if (oldIgn) {
            state.registeredAccounts = state.registeredAccounts.filter(
              (a) => a.ign.toLowerCase() !== oldIgn.toLowerCase()
            );
            saveJson(STORAGE_KEYS.registeredAccounts, state.registeredAccounts);
          }
          safeLocalStorageRemove(STORAGE_KEYS.linkedUser);
          state.modal = null;
          showToast('Account unlinked');
          render();
        };
      }

      const switchToReg = document.getElementById('switch-to-register-btn');
      if (switchToReg) {
        switchToReg.onclick = () => {
          state.modal = 'register';
          renderModals();
        };
      }

      const loginForm = document.getElementById('login-account-form');
      if (loginForm) {
        loginForm.onsubmit = (e) => {
          e.preventDefault();
          const ign = document.getElementById('login-ign-input').value.trim();
          const pass = document.getElementById('login-pass-input').value;
          const errBox = document.getElementById('login-error-box');

          const match = state.registeredAccounts.find((a) => a.ign.toLowerCase() === ign.toLowerCase());
          if (!match) {
            errBox.textContent = `No registered account found for "${ign}". Register first.`;
            errBox.classList.remove('hidden');
            return;
          }
          if (match.password !== pass) {
            errBox.textContent = 'Incorrect password for this account.';
            errBox.classList.remove('hidden');
            return;
          }

          state.linkedUser = { ...match, lastLoginAt: new Date().toISOString() };
          saveJson(STORAGE_KEYS.linkedUser, state.linkedUser);
          state.modal = null;
          showToast(`Logged in as ${state.linkedUser.ign}`);
          render();
        };
      }

      const regForm = document.getElementById('register-account-form');
      if (regForm) {
        regForm.onsubmit = async (e) => {
          e.preventDefault();
          const ign = document.getElementById('reg-ign-input').value.trim();
          const discord = document.getElementById('reg-discord-input').value.trim();
          const password = document.getElementById('reg-pass-input').value;
          const region = document.getElementById('reg-region-input').value;
          if (!ign || !discord || !password) return;

          const existing = state.registeredAccounts.find((a) => a.ign.toLowerCase() === ign.toLowerCase());
          const linkCode = existing?.linkCode || generateLinkCode();
          const accountRecord = {
            ign,
            discord,
            password,
            region,
            linkCode,
            linkedAt: new Date().toISOString(),
          };

          state.linkedUser = accountRecord;
          state.registeredAccounts = [
            accountRecord,
            ...state.registeredAccounts.filter((a) => a.ign.toLowerCase() !== ign.toLowerCase()),
          ];
          saveJson(STORAGE_KEYS.linkedUser, state.linkedUser);
          saveJson(STORAGE_KEYS.registeredAccounts, state.registeredAccounts);

          const unrankedMap = {};
          ALL_MODES.forEach((m) => (unrankedMap[m.id] = '???'));

          if (!state.players.some((p) => p.ign.toLowerCase() === ign.toLowerCase())) {
            state.players = [
              {
                id: `p-${Date.now()}`,
                ign,
                country: region === 'Europe' ? 'EU' : region === 'Asia' ? 'AS' : region === 'South America' ? 'SA' : 'US',
                region,
                discord,
                skinSeed: ign,
                wins: 0,
                winRate: '0.0%',
                tiers: unrankedMap,
              },
              ...state.players,
            ];
            saveJson(STORAGE_KEYS.players, state.players);
          }

          await sendWebhookAlert(
            `🔗 **New Account Linked!** IGN: **${ign}** | Discord: **${discord}** | Region: **${region}** | Code: \`${linkCode}\` | Server: \`${SERVER_IP}\``
          );

          state.modal = null;
          showToast(`Registered & locked as ${ign} · Code ${linkCode}`);
          render();
        };
      }

      const customAddForm = document.getElementById('custom-add-form');
      if (customAddForm) {
        customAddForm.onsubmit = (e) => {
          e.preventDefault();
          const ign = document.getElementById('new-p-ign').value.trim();
          const region = document.getElementById('new-p-region').value;
          if (!ign) return;
          const tiers = {};
          ALL_MODES.forEach((m) => (tiers[m.id] = '???'));
          state.players = [
            {
              id: `p-${Date.now()}`,
              ign,
              country: region === 'Europe' ? 'EU' : region === 'Asia' ? 'AS' : region === 'South America' ? 'SA' : 'US',
              region,
              discord: `${ign.toLowerCase()}#0001`,
              skinSeed: ign,
              wins: 0,
              winRate: '0.0%',
              tiers,
            },
            ...state.players,
          ];
          saveJson(STORAGE_KEYS.players, state.players);
          state.modal = null;
          showToast(`Added ${ign}`);
          render();
        };
      }
    }

    function bindPageEvents() {
      document.querySelectorAll('.inspect-trigger').forEach((el) => {
        el.onclick = () => {
          state.inspectedPlayerId = el.getAttribute('data-inspect-id');
          state.modal = 'player';
          renderModals();
        };
      });

      const viewRankBtn = document.getElementById('home-view-rankings');
      const fullLbBtn = document.getElementById('home-full-lb');
      const botLbBtn = document.getElementById('home-bottom-lb');
      const goRankings = () => {
        state.page = 'rankings';
        render();
      };
      if (viewRankBtn) viewRankBtn.onclick = goRankings;
      if (fullLbBtn) fullLbBtn.onclick = goRankings;
      if (botLbBtn) botLbBtn.onclick = goRankings;

      const getTestedBtn = document.getElementById('home-get-tested');
      if (getTestedBtn) {
        getTestedBtn.onclick = () => {
          state.modal = state.linkedUser ? 'profile' : 'register';
          renderModals();
        };
      }

      const copyBtn = document.getElementById('copy-ip-btn');
      if (copyBtn) {
        copyBtn.onclick = () => {
          if (navigator?.clipboard?.writeText) navigator.clipboard.writeText(SERVER_IP).catch(() => {});
          state.copiedIp = true;
          showToast(`Copied ${SERVER_IP}`);
          render();
          setTimeout(() => {
            state.copiedIp = false;
            render();
          }, 1500);
        };
      }

      const betaBtn = document.getElementById('board-beta');
      const legacyBtn = document.getElementById('board-legacy');
      if (betaBtn) betaBtn.onclick = () => { state.homeBoardMode = 'BETA'; render(); };
      if (legacyBtn) legacyBtn.onclick = () => { state.homeBoardMode = 'LEGACY'; render(); };

      document.querySelectorAll('.mode-tab-btn').forEach((btn) => {
        btn.onclick = () => {
          state.activeMode = btn.getAttribute('data-mode-id');
          render();
        };
      });

      const moreModesBtn = document.getElementById('toggle-more-modes');
      if (moreModesBtn) {
        moreModesBtn.onclick = () => {
          state.showMoreModes = !state.showMoreModes;
          render();
        };
      }

      const openDistBtn = document.getElementById('open-dist-btn');
      if (openDistBtn) {
        openDistBtn.onclick = () => {
          state.modal = 'distribution';
          renderModals();
        };
      }

      const searchInput = document.getElementById('search-input');
      if (searchInput) {
        searchInput.oninput = (e) => {
          state.searchQuery = e.target.value;
          render();
        };
      }

      const standingBtn = document.getElementById('standing-btn');
      if (standingBtn) {
        standingBtn.onclick = () => {
          state.modal = state.linkedUser ? 'profile' : 'login';
          renderModals();
        };
      }

      const regionSelect = document.getElementById('region-select');
      if (regionSelect) {
        regionSelect.onchange = (e) => {
          state.regionFilter = e.target.value;
          render();
        };
      }

      const sortDirBtn = document.getElementById('sort-dir-btn');
      if (sortDirBtn) {
        sortDirBtn.onclick = () => {
          state.sortAsc = !state.sortAsc;
          render();
        };
      }

      const adminLoginForm = document.getElementById('admin-login-form');
      if (adminLoginForm) {
        adminLoginForm.onsubmit = (e) => {
          e.preventDefault();
          const pass = document.getElementById('admin-pass-input').value;
          if (pass === ADMIN_PASSCODE) {
            state.isAdminAuthed = true;
            safeLocalStorageSet(STORAGE_KEYS.adminAuthed, 'true');
            showToast('Admin Panel unlocked & remembered');
            render();
          } else {
            showToast('Invalid admin passcode');
          }
        };
      }

      const adminLockBtn = document.getElementById('admin-lock-btn');
      if (adminLockBtn) {
        adminLockBtn.onclick = () => {
          state.isAdminAuthed = false;
          safeLocalStorageRemove(STORAGE_KEYS.adminAuthed);
          showToast('Admin session locked');
          render();
        };
      }

      const resetBtn = document.getElementById('reset-defaults-btn');
      if (resetBtn) {
        resetBtn.onclick = () => {
          state.players = [...INITIAL_PLAYERS];
          state.tierPoints = { ...DEFAULT_TIER_POINTS };
          safeLocalStorageRemove(STORAGE_KEYS.players);
          safeLocalStorageRemove(STORAGE_KEYS.tierPoints);
          showToast('Reset players & tier points to defaults');
          render();
        };
      }

      const customAddOpen = document.getElementById('open-custom-add');
      if (customAddOpen) {
        customAddOpen.onclick = () => {
          state.modal = 'customAdd';
          renderModals();
        };
      }

      const quickForm = document.getElementById('quick-tier-form');
      if (quickForm) {
        quickForm.onsubmit = (e) => {
          e.preventDefault();
          const pid = document.getElementById('quick-player-select').value;
          const mid = document.getElementById('quick-mode-select').value;
          const tid = document.getElementById('quick-tier-select').value;
          state.studioPlayerId = pid;
          state.studioModeId = mid;
          state.studioTierCode = tid;
          assignTier(pid, mid, tid);
        };
      }

      document.querySelectorAll('.inline-tier-select').forEach((sel) => {
        sel.onchange = () => {
          assignTier(sel.getAttribute('data-player-id'), sel.getAttribute('data-mode-id'), sel.value);
        };
      });

      document.querySelectorAll('.delete-player-btn').forEach((btn) => {
        btn.onclick = () => {
          const id = btn.getAttribute('data-delete-id');
          state.players = state.players.filter((p) => p.id !== id);
          saveJson(STORAGE_KEYS.players, state.players);
          showToast('Removed player');
          render();
        };
      });
    }

    function render() {
      renderNav();
      const overallList = getRankedOverall();
      const main = document.getElementById('app-main');

      if (state.page === 'home') {
        main.innerHTML = renderHome(overallList);
      } else if (state.page === 'rankings') {
        main.innerHTML = renderRankings(overallList);
      } else {
        main.innerHTML = renderAdmin();
      }

      bindPageEvents();
      renderModals();
    }

    document.getElementById('nav-home').onclick = () => { state.page = 'home'; render(); };
    document.getElementById('nav-rankings').onclick = () => { state.page = 'rankings'; render(); };
    document.getElementById('nav-admin').onclick = () => { state.page = 'admin'; render(); };
    document.getElementById('brand-logo-btn').onclick = () => { state.page = 'home'; render(); };

    render();
  </script>
</body>
</html>
